<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SoulSonic Result</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">
        <h1>🎵 SOULSONIC 🎵</h1>
        <p class="subtitle">Here is your wonderfully wrong result!</p>

        <section class="result" aria-labelledby="mood-title">
            <h2 id="mood-title">Detected mood</h2>
            <p id="mood">Ready for detection</p>
        </section>

        <section class="song" aria-labelledby="song-title">
            <h2 id="song-title">Song for you 🫴</h2>
            <p id="song">No song selected</p>
            <audio id="musicPlayer" controls>
                Your browser does not support audio.
            </audio>
        </section>

        <a class="back-button" href="{{ url_for('home') }}">Back to Camera</a>
    </main>

</body>
</html>
