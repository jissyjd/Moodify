<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thalathiri 🎵</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="container">
        <h1>🎵 THALATHIRI 🎵</h1>
        <p class="subtitle">Perfect song for your perfect mood 😂</p>

        <section class="camera-section" aria-labelledby="camera-title">
            <h2 id="camera-title">📷 Camera</h2>
            <div class="camera-box">
                <video id="camera" autoplay playsinline></video>
            </div>
            <button id="startCamera" type="button">Start Camera</button>
            <button id="detectMood" type="button" disabled>Detect Mood</button>
        </section>

        <section class="result" aria-labelledby="mood-title" aria-live="polite" hidden>

    <div class="popup-icon">🤪</div>

    <h2 id="mood-title">THALATHIRI DECIDED!</h2>

    <p>
        Detected mood:
    </p>

    <p id="mood">Waiting...</p>

</section>


<section class="song" aria-labelledby="song-title" hidden>

    <h2 id="song-title">🎶 Your PERFECTLY WRONG Song</h2>

    <p id="song">No song selected</p>

    <div class="wrong-message">
        ⚠️ This song is probably VERY wrong 😂
    </div>

    <audio id="musicPlayer" controls>
        Your browser does not support audio.
    </audio>

    <div class="laugh">
        😂 🎵 😂 🎵 😂
    </div>

</section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
