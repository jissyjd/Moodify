<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thalathiri 🎵</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>THALATHIRI 😛</h1>

        <p class="subtitle">
            Perfect song for your perfect mood!
        </p>

        <div class="music-icon">🎧</div>

        <h2>How are you feeling?</h2>

        <form action="/play" method="POST">

            <div class="mood-buttons">

                <button type="submit" name="mood" value="happy">
                    😄<br>
                    Happy
                </button>

                <button type="submit" name="mood" value="sad">
                    😭<br>
                    Sad
                </button>

                <button type="submit" name="mood" value="angry">
                    😡<br>
                    Angry
                </button>

                <button type="submit" name="mood" value="romantic">
                    ❤️<br>
                    Romantic
                </button>

                <button type="submit" name="mood" value="tired">
                    😴<br>
                    Tired
                </button>

            </div>

        </form>

        {% if song %}

        <div class="result">

            <h2>🎶 Thalathiri has decided...</h2>

            <p>Your mood:</p>

            <h3>{{ selected_mood }}</h3>

            <p>And your completely WRONG song is:</p>

            <div class="song">
                🎵 {{ song }}
            </div>

            <p class="warning">
                ⚠️ Don't blame us. Blame Thalathiri.
            </p>

        </div>

        {% endif %}

    </div>

    <!-- Random floating decorations -->

    <div class="bubble bubble1">🎵</div>
    <div class="bubble bubble2">🎧</div>
    <div class="bubble bubble3">😂</div>
    <div class="bubble bubble4">🎶</div>

</body>
</html>
