<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THALATHIRI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎵 THALATHIRI 🎵</h1>

        <p class="tagline">
            Your mood. Our wrong music. 😂
        </p>

        <div class="camera-box">
            <video id="camera" autoplay></video>
        </div>

        <button id="startCamera">📷 Start Camera</button>

        <button id="detectMood">🤖 Detect My Mood</button>

        <div class="result">
            <h2>Detected Mood</h2>
            <p id="mood">Waiting...</p>
        </div>

        <div class="song">
            <h2>❌ Thalathiri's Choice</h2>
            <p id="song">No song selected</p>

            <audio id="musicPlayer" controls>
                Your browser does not support audio.
            </audio>
        </div>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
