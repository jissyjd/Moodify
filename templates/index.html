<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SoulSonic 🎵</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
</head>

<body>
    <!-- Floating funny images -->

    <div class="floating-image image-left">
        <img src="{{ url_for('static', filename='images/image1.jpg') }}"
             alt="Funny decoration">
    </div>

    <div class="floating-image image-right">
        <img src="{{ url_for('static', filename='images/image2.jpg') }}"
            alt="Funny decoration">
    </div>

    <div class="floating-image image-top">
        <img src="{{ url_for('static', filename='images/image3.jpg') }}"
             alt="Funny decoration">
    </div>

    <div class="floating-image image-bottom">
        <img src="{{ url_for('static', filename='images/image4.jpg') }}"
             alt="Funny decoration">
    </div>

    <main class="container">
        <h1>🎵 SOULSONIC 🎵</h1>
        <p class="subtitle">Perfect song for your perfect mood 😂</p>

        <section class="camera-section" aria-labelledby="camera-title">
            <h2 id="camera-title">📷 Camera</h2>
            <div class="camera-box">
                <video id="camera" autoplay playsinline></video>
            </div>
            <button id="startCamera" type="button">Start Camera</button>
            <button id="detectMood" type="button" disabled>Loading mood detector...</button>
        </section>

        <section class="result" aria-labelledby="mood-title" aria-live="polite" hidden>

    <div class="popup-icon">🤪</div>

    <h2 id="mood-title">SOULSONIC DECIDED!</h2>

    <p>
        Detected mood:
    </p>

    <p id="mood">Waiting...</p>

</section>


<section class="song" aria-labelledby="song-title" hidden>

    <h2 id="song-title">🎶 Your Mood Song</h2>

    <p id="song">No song selected</p>

    <div class="song-message">
        🎧 Playing the song for your detected mood
    </div>

    <label for="musicPlayer">▶️ Music player</label>
    <audio id="musicPlayer" title="Recommended song" controls preload="metadata">
        Your browser does not support audio.
    </audio>

    <div class="laugh">
        😂 🎵 😂 🎵 😂
    </div>

</section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
